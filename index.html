  function injectStyle() {
    var style = document.createElement("style");
    // Hover box is painted by the host (from streamed rects); the guest
    // marks the selected element and, in comment mode, swaps the native
    // cursor for the comment bubble (forced, so page cursor styles don't
    // fight the picker). While a composer or thread card is open the arrow
    // returns, so the bubble cursor and the pin just placed never show at
    // once. Keyed on <html> data attributes, which page scripts that
    // rewrite body.className leave alone; ":not(#_)" lifts the rules to
    // id-level specificity so a page's own !important cursor rules lose.
    var ANY = ":not(#__cwhr_)";
    var MODE = "html[data-cwhr-mode]";
    var COMPOSING = MODE + "[data-cwhr-composing]";
    style.textContent =
      "." + SEL_CLASS + "{outline:1px solid hsl(40 70% 40%) !important;outline-offset:0;}" +
      MODE + ANY + "," + MODE + " " + ANY + "{cursor:" + BUBBLE_CURSOR + " !important;}" +

  function isUnique(sel) {
    try {
      return document.querySelectorAll(sel).length === 1;
    } catch (e) {
      return false;
    }
  }

  // Mirrors the host's stripInvisibles ranges. The host strips these
  // from stored selectors, so a selector built on a value containing
  // them would validate here but never match again - skip those rungs
  // and fall through to the structural ladder instead.
  function hasInvisibles(s) {
    for (var i = 0; i < s.length; i++) {
      var c = s.codePointAt(i);
      if (c > 0xffff) i++;

        c <= 0x1f ||
        c === 0x061c ||
        c === 0x070f ||
        c === 0xad ||
        (c >= 0x7f && c <= 0x9f) ||
        c === 0x115f ||
        c === 0x1160 ||
        c === 0x180e ||
        (c >= 0x200b && c <= 0x200f) ||
        (c >= 0x202a && c <= 0x202e) ||
        (c >= 0x2060 && c <= 0x2064) ||
        (c >= 0x2066 && c <= 0x2069) ||
        c === 0x3164 ||
        c === 0xfeff ||
        (c >= 0xfff9 && c <= 0xfffb) ||
        c === 0xffa0 ||

  function escapeAttr(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
  }

  // Selector ladder: unique #id -> unique [data-*] -> structural
  // tag:nth-of-type path rooted at the nearest unique-id ancestor.
  function selectorFor(el) {
    if (el.id && !hasInvisibles(el.id) && isUnique("#" + CSS.escape(el.id))) {

    }
    for (var i = 0; i < el.attributes.length; i++) {
      var attr = el.attributes[i];
      if (
        attr.name.indexOf("data-") === 0 &&
        attr.value &&
        !hasInvisibles(attr.value)

        if (isUnique(dataSel)) return dataSel;

      var sel = cur.tagName.toLowerCase();
      var parent = cur.parentElement;
      if (parent) {
        var sameTag = [];
        for (var c = 0; c < parent.children.length; c++) {
          if (parent.children[c].tagName === cur.tagName) sameTag.push(parent.children[c]);
        }
        if (sameTag.length > 1) {
          sel += ":nth-of-type(" + (sameTag.indexOf(cur) + 1) + ")";
        }
      }
      parts.unshift(sel);
      if (
        parent &&
        parent.id &&
        !hasInvisibles(parent.id) &&
        isUnique("#" + CSS.escape(parent.id))
      ) {
        parts.unshift("#" + CSS.escape(parent.id));
        return parts.join(" > ");
      }
      cur = parent;
    }
    if (cur === document.body) {
      parts.unshift("body");
      return parts.join(" > ");
    }
    // Depth cap hit without a root - an unrooted chain would match the
    // first structural pattern anywhere in the document. Mark the pin
    // detached instead of attaching it to the wrong element.
    return ":not(*)";
  }

  function descriptorFor(el) {
    var tag = "<" + el.tagName.toLowerCase() + ">";
    var idPart = el.id ? " #" + el.id : "";
    var text = visibleText(el).slice(0, 60);
    var textPart = text ? ' "' + text + '"' : "";
    // Nearest id'd ancestor, skipping the UCR-injected
    // #artifacts-component-root-* wrapper which is implementation noise.
    var section = el.parentElement;
    while (
      section &&
      (!section.id || section.id.indexOf("artifacts-component-root") === 0)
    ) {
      section = section.parentElement;
    }
    var sectionPart = section && section.id ? " in #" + section.id : "";
    return (tag + idPart + textPart + sectionPart).slice(0, 400);
  }

  // textContent offset of (node, offset) within body - the coordinate
  // system text-quote anchors are stored in. -1 when the boundary
  // isn't under body (shadow root, detached).
  function textOffset(node, offset) {
    var body = document.body;
    if (!body) return -1;
    try {
      var pre = document.createRange();
      pre.selectNodeContents(body);
      pre.setEnd(node, offset);
      return pre.toString().length;
    } catch (e) {
      return -1;
    }
  }

  // Inverse: build a Range covering [start, end) in body.textContent.
  function rangeForOffsets(start, end) {
    var body = document.body;
    if (!body) return null;
    var walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT);
    var acc = 0;
    var range = document.createRange();
    var haveStart = false;
    var t;
    while ((t = walker.nextNode())) {
      var next = acc + t.length;
      if (!haveStart && start < next) {
        range.setStart(t, start - acc);
        haveStart = true;
      }
      if (haveStart && end <= next) {
        range.setEnd(t, end - acc);
        return range;
      }
      acc = next;
    }
    return null;
  }

  // Context-scored search (W3C text-quote resolution): slice-check the
  // hint, else pick the occurrence whose surrounding chars best match
  // prefix/suffix. MIRRORS locateTextQuote() above line-for-line - the
  // tested export is the contract; this copy is what the sandbox runs.
  function locateQuote(text, q) {
    var ex = q.exact;
    if (!ex) return null;
    var hint = q.startOffset >= 0 ? q.startOffset : 0;
    if (text.slice(hint, hint + ex.length) === ex) {
      return { start: hint, end: hint + ex.length };
    }
    var best = -1;
    var bestScore = -1;
    var bestDist = Infinity;
    var scanned = 0;
    for (var idx = text.indexOf(ex); idx !== -1 && ++scanned <= 1000; idx = text.indexOf(ex, idx + 1)) {
      var before = text.slice(Math.max(0, idx - CONTEXT_LEN), idx);
      var after = text.slice(idx + ex.length, idx + ex.length + CONTEXT_LEN);
      var sc = 0;
      for (var i = 1; i <= q.prefix.length && i <= before.length; i++) {
        if (q.prefix[q.prefix.length - i] !== before[before.length - i]) break;
        sc++;
      }
      for (var j = 0; j < q.suffix.length && j < after.length; j++) {
        if (q.suffix[j] !== after[j]) break;
        sc++;
      }
      var dist = Math.abs(idx - hint);
      if (sc > bestScore || (sc === bestScore && dist < bestDist)) {
        best = idx;
        bestScore = sc;
        bestDist = dist;
      }

  }

    var out = [];

        out.push({ x: r.left, y: r.top, w: r.width, h: r.height });
      }
    }
    return out;
  }

  function reportTextSel(full) {
    if (!port) return;
    var sel = window.getSelection();
    var r = sel && !sel.isCollapsed && sel.rangeCount > 0 ? sel.getRangeAt(0) : null;

      if (hasTextSel) {
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
      }
      return;
    }
    hasTextSel = true;
    var br = r.getBoundingClientRect();

      type: "textCapture",
      rect: { x: br.left, y: br.top, w: br.width, h: br.height },

      var eo = textOffset(r.endContainer, r.endOffset);

        // rect-only post here would make the host pair the new rect
        // with a stale prior anchor - clear instead.
        hasTextSel = false;
        port.postMessage({ type: "textClear" });
        return;
      }
      // Denomination invariant: exact/prefix/suffix are byte-identical
      // slices of body.textContent. Truncation adjusts endOffset so
      // the host's (endOffset - startOffset === exact.length) shape
      // check holds. Cut points back off surrogate halves - a lone
      // surrogate would never relocate and fails UTF-8 persist.
      var capped = Math.min(eo, so + EXACT_CAP);

        var hc = live.charCodeAt(capped - 1);

      }
      if (capped <= so) {
        port.postMessage(msg);
        return;
      }
      var pStart = Math.max(0, so - CONTEXT_LEN);
      var pc = live.charCodeAt(pStart);
      if (pc >= 0xdc00 && pc <= 0xdfff) pStart++;
      var sEnd = Math.min(live.length, capped + CONTEXT_LEN);
      if (sEnd < live.length) {
        var sc = live.charCodeAt(sEnd - 1);
        if (sc >= 0xd800 && sc <= 0xdbff) sEnd--;
      }
      msg.exact = live.slice(so, capped);
      msg.prefix = live.slice(pStart, so);
      msg.suffix = live.slice(capped, sEnd);
      msg.startOffset = so;
      msg.endOffset = capped;
    }
    port.postMessage(msg);
  }

  function clearSelection() {
    if (selected) {
      selected.classList.remove(SEL_CLASS);
      selected = null;
    }
  }

  // rAF-throttled cursor + hover-rect stream so the host can paint the
  // inspector hover box (and knows the pointer is present) in comment mode.
  var cursorPending = false;
  var cursorX = -1;
  var cursorY = -1;
  function flushCursor() {
    cursorPending = false;
    if (!port) return;
    var hover = null;
    if (
      hoverEl &&
      hoverEl.nodeType === 1 &&
      hoverEl !== document.body &&
      hoverEl !== document.documentElement
    ) {
      var r = hoverEl.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) {
        hover = { x: r.left, y: r.top, w: r.width, h: r.height };
      }
    }
    port.postMessage({ type: "cursor", x: cursorX, y: cursorY, hover: hover });
  }
  function scheduleCursor() {
    if (!cursorPending) {
      cursorPending = true;
      requestAnimationFrame(flushCursor);
    }
  }
  function onMouseMove(ev) {
    if (!mode || !port) return;
    // Over the scrollbar gutter (clientX/Y past the content box) - hide
    // the hover box like a leave.
    var de = document.documentElement;
    if (ev.clientX >= de.clientWidth || ev.clientY >= de.clientHeight) {
      cursorX = -1;
      cursorY = -1;
      hoverEl = null;
      scheduleCursor();
      return;
    }
    cursorX = ev.clientX;
    cursorY = ev.clientY;
    hoverEl = ev.target;
    scheduleCursor();
  }
  function onMouseLeave() {
    if (!mode || !port) return;
    cursorX = -1;
    cursorY = -1;
    hoverEl = null;
    scheduleCursor();
  }

  function onClick(ev) {
    if (!port) return;
    if (!mode) {
      // Mode off: don't intercept the page, just let the host close any
      // open popover (thread card click-away). A non-collapsed selection
      // means the click ended a drag-select - not a click-away.
      var s = window.getSelection();
      if (!s || s.isCollapsed) port.postMessage({ type: "clickAway" });
      return;
    }
    ev.preventDefault();
    ev.stopImmediatePropagation();
    var el = ev.target;
    if (!el || el.nodeType !== 1 || el === document.documentElement) return;
    if (el === document.body && el.firstElementChild) {
      // Pin on body is rarely intentional; keep it anyway but as body.
    }
    clearSelection();
    selected = el;
    el.classList.add(SEL_CLASS);
    var rect = el.getBoundingClientRect();
    var pinX = rect.width > 0 ? (ev.clientX - rect.left) / rect.width : 0.5;
    var pinY = rect.height > 0 ? (ev.clientY - rect.top) / rect.height : 0.5;
    port.postMessage({
      type: "capture",
      selector: selectorFor(el).slice(0, 1000),
      textHint: visibleText(el).slice(0, 300),
      descriptor: descriptorFor(el),
      pinX: Math.min(1, Math.max(0, pinX)),
      pinY: Math.min(1, Math.max(0, pinY)),
      clientX: ev.clientX,
      clientY: ev.clientY,
      rectLeft: rect.left,
      rectTop: rect.top,
    });
  }

  function reportRects() {
    rafPending = false;
    if (!port) return;
    // Selected element's live bounds - keeps the host's draft pin /
    // inspector tag / composer glued through scroll and reflow.
    if (selected) {
      var sr = selected.getBoundingClientRect();
      port.postMessage({
        type: "selRect",
        left: sr.left,
        top: sr.top,
        w: sr.width,
        h: sr.height,
        found:
          (sr.width > 0 || sr.height > 0) &&
          document.documentElement.contains(selected),
      });
    }
    var rects = [];
    for (var i = 0; i < pins.length; i++) {
      var p = pins[i];
      var el = null;
      try {
        el = document.querySelector(p.selector);
      } catch (e) {
        el = null;
      }
      if (!el) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      var r = el.getBoundingClientRect();
      if (r.width === 0 && r.height === 0) {
        rects.push({ id: p.id, x: 0, y: 0, found: false });
        continue;
      }
      rects.push({
        id: p.id,
        x: r.left + p.pinX * r.width,
        y: r.top + p.pinY * r.height,
        found: true,
      });
    }
    var quoteRects = [];
    if (quotes.length > 0) {
      var live = null;
      for (var qi = 0; qi < quotes.length; qi++) {
        var q = quotes[qi];
        var qr = quoteRanges[q.id];
        if (qr === undefined) {
          if (live === null) {
            live = (document.body && document.body.textContent) || "";
          }
          var loc = locateQuote(live, q);
          qr = (loc && rangeForOffsets(loc.start, loc.end)) || null;
          quoteRanges[q.id] = qr;
        }
        // Zero paintable rects (display:none subtree) reports as
        // not-found so the host docks it as detached instead of
        // rendering nothing clickable.
        var qlr = qr ? collectLineRects(qr, 80) : [];
        quoteRects.push(
          qlr.length > 0
            ? { id: q.id, found: true, lineRects: qlr }
            : { id: q.id, found: false, lineRects: [] }
        );
      }
    }
    port.postMessage({
      type: "rects",
      rects: rects,
      quoteRects: quoteRects,
      scrollY: window.scrollY || 0,
    });
  }

  function scheduleRects() {
    if (rafPending) return;
    rafPending = true;
    var done = false;
    function run() {
      if (done) return;
      done = true;
      reportRects();
    }
    // rAF for paint alignment, with a timeout fallback - rAF is
    // suspended entirely in hidden tabs and pins must still settle
    // when the tab becomes visible after background loading.
    requestAnimationFrame(run);
    setTimeout(run, 150);
  }

  function setMode(on) {
    mode = !!on;
    document.documentElement.toggleAttribute("data-cwhr-mode", mode);
    if (!mode) {
      hoverEl = null;
      clearSelection();
    }
  }

  function setComposing(open) {
    document.documentElement.toggleAttribute("data-cwhr-composing", !!open);
  }

  function onPortMessage(ev) {
    var data = ev.data;
    if (!data) return;
    if (data.type === "mode") setMode(data.on);
    else if (data.type === "composing") setComposing(data.open);
    else if (data.type === "pins") {
      pins = Array.isArray(data.pins) ? data.pins : [];
      scheduleRects();
    } else if (data.type === "quotes") {
      quotes = Array.isArray(data.quotes) ? data.quotes : [];
      quoteRanges = Object.create(null);
      scheduleRects();
    } else if (data.type === "clearSelection") {
      clearSelection();
    } else if (data.type === "clearTextSel") {
      var ts = window.getSelection();
      if (ts) ts.removeAllRanges();
      hasTextSel = false;
    } else if (data.type === "restoreScroll") {
      var ry = Number(data.y);
      if (isFinite(ry) && ry > 0) {
        // Apply now and again at load - late images/fonts can grow the
        // document after the first attempt clamps short.
        window.scrollTo(0, ry);
        window.addEventListener("load", function () {
          window.scrollTo(0, ry);
        });
      }
    }
  }

  function start() {
    injectStyle();
    var channel = new _MessageChannel();
    port = channel.port1;
    port.onmessage = onPortMessage;
    // Sandboxed srcdoc origins can be opaque; "*" is required. The
    // payload carries only the mount token (multiple sandboxes can be
    // mounted at once - the token routes the port to the right overlay)
    // and the channel port itself is pairwise-secure.
    _topPost(
      { type: READY_TYPE, token: "11193629-dab6-4526-8671-7ca588287cff" },
      "*",
      [channel.port2]
    );
    document.addEventListener("mousemove", onMouseMove, true);
    // documentElement (not document, capture) so this fires only when the
    // pointer leaves the viewport - capture-phase on document would fire for
    // every intra-document element-boundary crossing.
    document.documentElement.addEventListener("mouseleave", onMouseLeave);
    document.addEventListener("click", onClick, true);
    // Text-selection capture: commit on mouseup/keyup (Shift+Arrow),
    // clear on collapse. Not mode-gated; highlight-to-comment is
    // always on.
    function onSelCommit() { reportTextSel(true); }
    document.addEventListener("mouseup", onSelCommit, true);
    document.addEventListener("keyup", onSelCommit, true);
    document.addEventListener("selectionchange", function () {
      var s = window.getSelection();
      if (hasTextSel && (!s || s.isCollapsed)) reportTextSel(false);
    });
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" && port) port.postMessage({ type: "dismiss" });
    }, true);
    // Scroll/resize move the hovered element under a stationary pointer -
    // re-report its rect so the host's inspector box tracks it. Mutations
    // stay rects-only (animating pages would chatter the cursor stream).
    var textSelPending = false;
    function scheduleTextSel() {
      if (textSelPending) return;
      textSelPending = true;
      requestAnimationFrame(function () {
        textSelPending = false;
        reportTextSel(false);
      });
    }
    function onLayoutChange() {
      scheduleRects();
      if (mode && hoverEl) scheduleCursor();
      if (hasTextSel) scheduleTextSel();
    }
    window.addEventListener("scroll", onLayoutChange, true);
    window.addEventListener("resize", onLayoutChange);
    // Full-cache invalidate per childList mutation is acceptable: CSS
    // animation doesn't fire the observer; JS writers at frame rate
    // would re-relocate every frame but are rare. characterData isn't
    // observed, so .data= edits leave highlights stale until the next
    // childList mutation.
    var observer = new MutationObserver(function () {
      quoteRanges = Object.create(null);
      scheduleRects();
      if (hasTextSel) scheduleTextSel();
    });
    function observe() {
      if (document.body) observer.observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) observe();
    else document.addEventListener("DOMContentLoaded", observe);
    // Settle pins after late layout (fonts, images).
    setInterval(scheduleRects, 2000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start);
  } else {
    start();
  }
})();

    if(nf){ var b = mk('⭐ Favoritos', onlyFav, function(){ onlyFav = !onlyFav; render(); }); b.appendChild(el('small',null,nf)); }
    tags.forEach(function(g){
      var b = mk('#' + g.name, active.indexOf(g.name) > -1, function(){
        var k = active.indexOf(g.name); if(k > -1) active.splice(k,1); else active.push(g.name); render();
      });
      b.appendChild(el('small',null,g.n));
    });
  }

  function render(){
    // limpa filtros de tags que não existem mais
    var names = allTags().map(function(g){ return g.name; });
    active = active.filter(function(a){ return names.indexOf(a) > -1; });
    app.textContent = '';
    $('editBtn').hidden = !canEdit;
    $('tagsBtn').hidden = !(canEdit && editing);
    $('addBtn').hidden = !(canEdit && editing);
    $('dlBtn').hidden = !(canEdit && editing);
    $('editBtn').classList.toggle('on', editing);
    $('editBtn').textContent = editing ? '✅ Concluir' : '✏️ Editar';
    var n = $('note');
    n.hidden = !(canEdit && editing);
    if(!n.hidden) n.textContent = 'Modo de edição: as mudanças ficam salvas neste navegador. Para publicar no GitHub, clique em “⬇️ Baixar página” e envie o index.html novo.';
    renderFilters();

    var q = query.trim().toLowerCase();
    var list = state.tools.map(function(t,i){ return {t:t,i:i}; }).filter(function(o){
      var t = o.t, tg = t.tags || [];
      if(onlyFav && !t.fav) return false;
      if(active.length && !active.some(function(a){ return tg.indexOf(a) > -1; })) return false;
      return !q || (t.title + ' ' + (t.desc || '') + ' ' + tg.join(' ')).toLowerCase().indexOf(q) > -1;
    });
    // favoritos primeiro (ordem manual preservada dentro de cada grupo)
    list.sort(function(a,b){ return (b.t.fav ? 1 : 0) - (a.t.fav ? 1 : 0) || a.i - b.i; });

    var grid = el('div','grid');
    list.forEach(function(o){
      var t = o.t, i = o.i;
      var card = el('div','card');
      if(t.fav) card.classList.add('fav');
      if(!editing) card.classList.add('link');
      var head = el('div','head');
      if(t.emoji) head.appendChild(el('div','emoji', t.emoji));
      head.appendChild(el('div','t', t.title));
      card.appendChild(head);
      if(t.desc) card.appendChild(el('div','d', t.desc));
      if(t.tags && t.tags.length){
        var tg = el('div','tags'); t.tags.forEach(function(g){ tg.appendChild(el('span','tag','#' + g)); });
        card.appendChild(tg);
      }
      var st = el('button','star' + (t.fav ? ' on' : ''), t.fav ? '★' : '☆');
      st.title = t.fav ? 'Remover dos favoritos' : 'Favoritar';
      if(canEdit){
        st.onclick = function(ev){ ev.preventDefault(); ev.stopPropagation(); t.fav = !t.fav; render(); save(); };
      } else { st.disabled = true; if(!t.fav) st.hidden = true; }
      card.appendChild(st);
      if(editing){
        var tools = el('div','tools');
        var b3 = el('button',null,'Editar'); b3.onclick = function(){ openDlg(i); };
        var b4 = el('button','danger','Excluir');
        b4.onclick = function(){
          askConfirm('Tem certeza de que deseja excluir “' + t.title + '”? Essa ação não pode ser desfeita.', function(){
            state.tools.splice(i,1); render(); save();
          });
        };
        [b3,b4].forEach(function(b){ tools.appendChild(b); });
        card.appendChild(tools);
      }
      if(!editing){
        var lk = el('a','stretch'); lk.href = t.url; lk.target = '_blank'; lk.rel = 'noopener noreferrer'; lk.setAttribute('aria-label', t.title);
        card.appendChild(lk);
      } else {
        card.draggable = true;
        var sameGroup = function(){ return dragIdx > -1 && !!state.tools[dragIdx].fav === !!t.fav; };
        card.ondragstart = function(e){
          dragIdx = i; card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          try{ e.dataTransfer.setData('text/plain', String(i)); }catch(x){}
        };
        card.ondragend = function(){
          dragIdx = -1; card.classList.remove('dragging');
          Array.prototype.forEach.call(document.querySelectorAll('.over'), function(n){ n.classList.remove('over'); });
        };
        card.ondragover = function(e){ if(dragIdx === i || !sameGroup()) return; e.preventDefault(); card.classList.add('over'); };
        card.ondragleave = function(){ card.classList.remove('over'); };
        card.ondrop = function(e){
          e.preventDefault(); card.classList.remove('over');
          if(dragIdx < 0 || dragIdx === i || !sameGroup()) return;
          var x = state.tools.splice(dragIdx,1)[0]; state.tools.splice(i,0,x);
          dragIdx = -1; render(); save();
        };
      }
      grid.appendChild(card);
    });
    if(!grid.children.length){
      app.appendChild(el('div','empty', state.tools.length ? 'Nada encontrado com esses filtros.' : (canEdit ? 'Nada aqui ainda. Clique em “Editar” para adicionar o primeiro item.' : 'Nenhum item cadastrado ainda.')));
    } else app.appendChild(grid);
  }

  function move(i,d){
    var j = i + d; if(j < 0 || j >= state.tools.length) return;
    var x = state.tools.splice(i,1)[0]; state.tools.splice(j,0,x);
    render(); save();
  }
  var delFn = null;
  function askConfirm(msg, fn){ delFn = fn; $('delMsg').textContent = msg; $('delDlg').showModal(); }
  $('delNo').onclick = function(){ delFn = null; $('delDlg').close(); };
  $('delYes').onclick = function(){ var f = delFn; delFn = null; $('delDlg').close(); if(f) f(); };

  var sel = [], dragIdx = -1;
  function renderPick(){
    var p = $('pick'); p.textContent = '';
    if(!state.tags.length){ p.appendChild(el('span','d','Nenhuma tag criada ainda. Use o botão “🏷️ Tags” para criar.')); return; }
    allTags().forEach(function(g){
      var b = el('button','tag' + (sel.indexOf(g.name) > -1 ? ' sel' : ''), g.name);
      b.type = 'button';
      b.onclick = function(){ var k = sel.indexOf(g.name); if(k > -1) sel.splice(k,1); else sel.push(g.name); renderPick(); };
      p.appendChild(b);
    });
  }

  // Gerenciador de tags (salva ao concluir, para a página não recarregar no meio)
  var tagDlg = $('tagDlg'), tagDirty = false;
  function cleanTag(s){ return (s || '').trim().toLowerCase().replace(/,/g,''); }
  function renderTagMgr(){
    var l = $('tagList'); l.textContent = '';
    var tags = allTags();
    if(!tags.length) l.appendChild(el('div','d','Nenhuma tag ainda.'));
    tags.forEach(function(g){
      var r = el('div','trow'), inp = el('input'); inp.value = g.name; inp.maxLength = 30;
      inp.onchange = function(){ renameTag(g.name, inp.value); };
      var del = el('button','danger','Excluir');
      del.onclick = function(){
        askConfirm('Excluir a tag “' + g.name + '”? Ela será removida de todos os itens que a usam.', function(){ deleteTag(g.name); });
      };
      r.appendChild(inp); r.appendChild(el('small',null, g.n + (g.n === 1 ? ' item' : ' itens'))); r.appendChild(del);
      l.appendChild(r);
    });
  }
  function addTag(){
    var v = cleanTag($('newTag').value); if(!v) return;
    if(state.tags.indexOf(v) < 0){ state.tags.push(v); tagDirty = true; }
    $('newTag').value = ''; renderTagMgr(); render();
  }
  function renameTag(old, nv){
    nv = cleanTag(nv);
    if(!nv || nv === old){ renderTagMgr(); return; }
    state.tags = state.tags.filter(function(x){ return x !== old; });
    if(state.tags.indexOf(nv) < 0) state.tags.push(nv);
    state.tools.forEach(function(t){
      if(!t.tags) return; var k = t.tags.indexOf(old);
      if(k > -1){ t.tags.splice(k,1); if(t.tags.indexOf(nv) < 0) t.tags.push(nv); }
    });
    active = active.map(function(a){ return a === old ? nv : a; });
    tagDirty = true; renderTagMgr(); render();
  }
  function deleteTag(g){
    state.tags = state.tags.filter(function(x){ return x !== g; });
    state.tools.forEach(function(t){ if(t.tags) t.tags = t.tags.filter(function(x){ return x !== g; }); });
    tagDirty = true; renderTagMgr(); render();
  }
  var EMOJI = {
    'Trabalho': '🔧 🔨 🛠️ ⚙️ 🔩 🧰 🧲 🔌 💡 🔦 📎 📌 📍 ✂️ 📏 📐 🖇️ 🗂️ 📁 📂 🗃️ 🗄️ 📋 📊 📈 📉 📝 ✏️ 🖊️ 🖋️ 📒 📓 📔 📕 📗 📘 📙 📚 📖 🔖 🏷️ 📅 📆 🗓️ ⏰ ⏱️ ⌛ 📧 ✉️ 📨 📩 📞 ☎️ 📱 💬 🗨️ 📢 📣 🔔 🔍 🔎 🔗 🔒 🔓 🔑 🧾 💳 💰 💵 🏦 🧮 📦 🗑️',
    'Tech': '🤖 🦾 🦿 💻 🖥️ ⌨️ 🖱️ 🖨️ 💾 💿 📀 🔋 📡 🛰️ 🚀 🛸 🎮 🕹️ 👾 🧠 🧬 🔬 🔭 🧪 ⚗️ 🌐 📶 📲 ☁️ 🕸️ 🪛 🪚 🧩 📺 📻 🎧 🎤 📷 🎥 📹 🔊 🔆 ⚡ 🔮',
    'Escola e pessoas': '🎓 🏫 🏢 🧑‍🏫 👨‍🏫 👩‍🏫 🧑‍🎓 👨‍🎓 👩‍🎓 🧑‍💻 👨‍💻 👩‍💻 👥 👤 🙋 🤝 👏 🙌 👍 👋 👶 🧒 👦 👧 🧑 👨 👩 👪 🏆 🥇 🥈 🥉 🏅 🎖️ 🎯 🎲 ♟️ 🎨 🖌️ 🎭 🎵 🎶 🎬 ✍️ 🗣️ 💪 🙏',
    'Símbolos': '✅ ✔️ ❌ ⭐ 🌟 ✨ 💫 🔥 💥 ❗ ❓ ⚠️ 🚨 🛑 ⛔ 🚫 ♻️ 🔄 🔁 ⏩ ▶️ ⏸️ ⏹️ 🔴 🟠 🟡 🟢 🔵 🟣 ⚫ ⚪ 🟥 🟧 🟨 🟩 🟦 🟪 ⬛ ⬜ ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💯 🆕 🆗 🆒 🔰 ➕ ➖ ➗ ✖️ 🔢 🔤 ℹ️ ⬆️ ⬇️ ➡️ ⬅️ ↗️ 🔝 🔜',
    'Mais': '🏠 🏡 🏙️ 🌎 🌍 🌏 🗺️ 🧭 🚚 🚗 ✈️ 🚌 🌱 🌳 🌻 🌈 ☀️ 🌙 ⛅ 🌧️ ❄️ 🍎 🍕 ☕ 🍰 🎉 🎁 🎈 🎂 🐱 🐶 🦊 🐼 🦉 🐢 🦋 🐝 🐙 🦄 🐉 🦖 🐧 🏃 ⚽ 🏀 🧘 🛒 💎 👑 🎪 🎠 🗿 🧸'
  };
  var emojiCat = 'Trabalho';
  function renderEmoji(){
    var tabs = $('emojiTabs'), g = $('emojiGrid'); tabs.textContent = ''; g.textContent = '';
    Object.keys(EMOJI).forEach(function(k){
      var b = el('button','fchip' + (k === emojiCat ? ' on' : ''), k); b.type = 'button';
      b.onclick = function(){ emojiCat = k; renderEmoji(); };
      tabs.appendChild(b);
    });
    EMOJI[emojiCat].split(' ').forEach(function(e){
      var b = el('button','eb',e); b.type = 'button';
      b.onclick = function(){ $('fEmoji').value = e; $('emojiPanel').hidden = true; };
      g.appendChild(b);
    });
  }
  $('emojiBtn').onclick = function(){ var p = $('emojiPanel'); p.hidden = !p.hidden; if(!p.hidden) renderEmoji(); };
  $('emojiNone').onclick = function(){ $('fEmoji').value = ''; $('emojiPanel').hidden = true; };

  $('addBtn').onclick = function(){ openDlg(-1); };
  $('tagsBtn').onclick = function(){ renderTagMgr(); tagDlg.showModal(); };
  $('addTagBtn').onclick = addTag;
  $('newTag').onkeydown = function(e){ if(e.key === 'Enter'){ e.preventDefault(); addTag(); } };
  $('tagClose').onclick = function(){ tagDlg.close(); };
  tagDlg.addEventListener('close', function(){ if(tagDirty){ tagDirty = false; save(); } });

  function openDlg(i){
    editIdx = i; var t = i > -1 ? state.tools[i] : {emoji:'',title:'',url:'',desc:'',tags:[]};
    $('dlgTitle').textContent = i > -1 ? 'Editar item' : 'Novo item';
    $('fEmoji').value = t.emoji || ''; $('fTitle').value = t.title; $('fUrl').value = t.url; $('fDesc').value = t.desc || '';
    sel = (t.tags || []).slice(); renderPick();
    $('fErr').textContent = ''; $('emojiPanel').hidden = true; dlg.showModal();
  }
  $('fCancel').onclick = function(){ dlg.close(); };
  $('fSave').onclick = function(){
    var title = $('fTitle').value.trim(), url = normUrl($('fUrl').value);
    if(!title){ $('fErr').textContent = 'Informe um título.'; return; }
    if(!url){ $('fErr').textContent = 'Informe um link válido.'; return; }
    var t = {emoji: $('fEmoji').value.trim(), title: title, url: url, desc: $('fDesc').value.trim(), tags: sel.slice()};
    if(editIdx > -1){ t.fav = !!state.tools[editIdx].fav; state.tools[editIdx] = t; } else state.tools.push(t);
    dlg.close(); render(); save();
  };

  $('editBtn').onclick = function(){
    editing = !editing;
    try{ sessionStorage.setItem('hubEdit', editing ? '1' : '0'); }catch(e){}
    render();
  };
  $('q').oninput = function(){ query = this.value; render(); };

  // Salvar: guarda neste navegador (localStorage) e permite baixar o index.html atualizado
  function buildHtml(){
    var c = document.documentElement.cloneNode(true);
    c.removeAttribute('data-theme'); c.removeAttribute('style');
    c.querySelector('#app').textContent = '';
    c.querySelector('#filters').textContent = '';
    c.querySelector('#pick').textContent = '';
    c.querySelector('#tagList').textContent = '';
    c.querySelector('#tagsBtn').hidden = true;
    c.querySelector('#addBtn').hidden = true;
    c.querySelector('#undo').hidden = true;
    c.querySelector('#undoMsg').textContent = '';
    c.querySelector('#emojiTabs').textContent = '';
    c.querySelector('#emojiGrid').textContent = '';
    c.querySelector('#emojiPanel').hidden = true;
    c.querySelector('#status').textContent = '';
    c.querySelector('#note').hidden = true;
    c.querySelector('#editBtn').hidden = true;
    c.querySelector('#editBtn').className = '';
    c.querySelector('#hub-data').textContent = JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html>\n' + c.outerHTML;
  }
  var LS = 'hubCnaData';
  function save(){
    state.rev = Date.now();
    try{ localStorage.setItem(LS, JSON.stringify(state)); statusEl.textContent = 'Salvo neste navegador ✓'; }
    catch(e){ statusEl.textContent = 'Não foi possível salvar neste navegador.'; }
  }
  $('dlBtn').onclick = function(){
    var blob = new Blob([buildHtml()], {type:'text/html'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    statusEl.textContent = 'index.html baixado. Envie-o ao GitHub (substituindo o antigo) para publicar.';
  };
  try{
    var saved = JSON.parse(localStorage.getItem(LS) || 'null');
    if(saved && saved.tools && (saved.rev || 0) > (state.rev || 0)){ state = saved; if(!state.tags) state.tags = []; }
  }catch(e){}
  render();
})();
</script>
